name: Publish approved stable FieldKit .38
on:
  push:
    branches: [main]
    paths:
      - 'data/publication-status.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'Maidenquinn/azeroth-fieldkit-reborn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Confirm exact approved version and publication status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/publication-status.json').read_text())
          toc=Path('AzerothFieldKitReborn/AzerothFieldKitReborn.toc').read_text()
          runtime=Path('AzerothFieldKitReborn/Runtime.lua').read_text()
          assert p['version']=='0.1.0-reborn.38'
          assert p['maintainerAcceptedForPublication'] is True
          assert p['githubPrerelease'] is False
          assert '## Version: 0.1.0-reborn.38' in toc
          assert 'version = "0.1.0-reborn.38"' in runtime
          PY
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/build_locales.py --check
      - run: python tests/test_locale_tokens.py
      - run: python tools/check_locale_fonts.py
      - run: python tools/audit.py
      - run: python tools/verify.py
      - run: python tools/test_reborn.py
      - name: Build and validate immutable install package
        run: |
          cp build/validation.json docs/validation.json
          python tools/package.py
          (cd dist && sha256sum -c SHA256SUMS.txt)
          test -f dist/AzerothFieldKitReborn-0.1.0-reborn.38.zip
      - name: Publish new stable release (never overwrite assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v0.1.0-reborn.38
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite immutable assets." >&2
            exit 1
          fi
          gh release create "$tag" \
            dist/AzerothFieldKitReborn-0.1.0-reborn.38.zip \
            dist/MANIFEST.json \
            dist/SHA256SUMS.txt \
            build/validation.json \
            --target "$GITHUB_SHA" \
            --title "Azeroth FieldKit Reborn .38 — Combat meter fixes" \
            --notes-file docs/RELEASE_REBORN_38.md \
            --latest
      - name: Verify published stable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.0-reborn.38 --json tagName,isPrerelease,assets \
            --jq '{tag: .tagName, prerelease: .isPrerelease, files: [.assets[].name]}'
          gh release download v0.1.0-reborn.38 \
            --pattern 'AzerothFieldKitReborn-0.1.0-reborn.38.zip' \
            --dir /tmp/fieldkit-release-check
          cmp dist/AzerothFieldKitReborn-0.1.0-reborn.38.zip /tmp/fieldkit-release-check/AzerothFieldKitReborn-0.1.0-reborn.38.zip
